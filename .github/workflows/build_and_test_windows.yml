name: Build and Test - Windows

on:
  push:
    branches: [main, add_windows_workflow]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build flows2fim (Windows binary)

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      uses: docker/setup-buildx-action@v3

    - name: Run Docker Compose
      run: |
        docker compose up -d
        docker ps

    - name: Attach to running container and Build Windows executable
      run: |
        CONTAINER_ID=$(docker ps -q | head -n 1)
        if [ -n "$CONTAINER_ID" ]; then
          docker exec $CONTAINER_ID /bin/bash -c "./scripts/build-windows-amd64.sh"
          docker compose down
        else
          echo "No running containers found"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flows2fim
        path: builds/windows-amd64

  test:
    name: Test flows2fim on Windows
    runs-on: windows-latest
    needs: build

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: flows2fim
        path: builds/windows-amd64

    - name: Add flows2fim to PATH and verify binary
      shell: powershell
      run: |
        Write-Host "Listing artifact contents"
        Get-ChildItem -Recurse builds\windows-amd64
        Write-Host "Invoke version"
        .\builds\windows-amd64\flows2fim.exe --version
        Add-Content -Path $env:GITHUB_PATH -Value "builds/windows-amd64"

    - name: Install & Configure GDAL
      shell: powershell
      run: |
        Write-Host "Attempting to install GDAL via Chocolatey (may fail on hosted runner)..."
        # Try choco install but do not fail the job if it can't install
        & choco install gdal -y
        if ($LASTEXITCODE -ne 0) {
          Write-Host "choco gdal install failed or package not found; continuing"
        }
        # refresh environment variables if available
        if (Get-Command refreshenv -ErrorAction SilentlyContinue) { refreshenv }
        # Only run gdalinfo if available
        if (Get-Command gdalinfo -ErrorAction SilentlyContinue) {
          gdalinfo --version
        } else {
          Write-Host "gdalinfo not found on PATH; will try to use Python GDAL bindings if available"
        }

    - name: Setup Conda (install GDAL faster via conda)
      uses: conda-incubator/setup-miniconda@v2
      with:
        auto-update-conda: true
        python-version: '3.9'
        use-mamba: true
        activate-environment: ci

    - name: Install GDAL + osgeo-utils with mamba
      shell: bash
      run: |
        # Use mamba (fast) to install GDAL and osgeo-utils from conda-forge
        mamba install -y -c conda-forge gdal osgeo-utils || true
        # show installed gdal/osgeo presence if available
        python -c "import importlib,sys; print('osgeo present' if importlib.util.find_spec('osgeo') else '')" || true

    - name: Add conda env scripts to PATH
      shell: powershell
      run: |
        Write-Host "Adding conda environment scripts path to PATH (if present)"
        $condaScripts = & conda run -n ci python -c "import sysconfig;print(sysconfig.get_path('scripts'))" 2>$null
        if ($condaScripts) { $condaScripts = $condaScripts.Trim() }
        if ($condaScripts -and (Test-Path -Path $condaScripts)) {
          Write-Host "Conda scripts path: $condaScripts"
          Add-Content -Path $env:GITHUB_PATH -Value $condaScripts
        } else {
          Write-Host "Conda scripts path not found or conda env not present: $condaScripts"
        }

    - name: Verify Python GDAL utilities (conda)
      shell: powershell
      run: |
        Write-Host "Verifying osgeo_utils availability in conda env 'ci'"
        & conda run -n ci python -c "import importlib,sys; sys.exit(0) if importlib.util.find_spec('osgeo_utils') else sys.exit(1)" 2>$null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "osgeo_utils available in conda env 'ci'"
        } else {
          Write-Host "osgeo_utils not available in conda env 'ci'. Tests will continue but some features may be limited."
        }
        # Also show conda python scripts path (for debugging)
        $pyScriptsPath = & conda run -n ci python -c "import sysconfig;print(sysconfig.get_path('scripts'))" 2>$null
        if ($pyScriptsPath) { $pyScriptsPath = $pyScriptsPath.Trim(); Write-Host "Conda python scripts path: $pyScriptsPath" }

    - name: Verify gdal installation
      shell: powershell
      run: |
        # Prefer gdalinfo if available, otherwise try to detect GDAL via Python bindings
        if (Get-Command gdalinfo -ErrorAction SilentlyContinue) {
          gdalinfo --version
          Write-Host "gdalinfo available: $(Get-Command gdalinfo -ErrorAction SilentlyContinue)"
        } else {
          Write-Host "gdalinfo not found; attempting to detect GDAL via Python bindings"
            $ver = & python -c 'from osgeo import gdal; import sys; print(gdal.__version__)' 2>$null || $null
          if ($ver) {
            Write-Host "GDAL Python binding version: $ver"
          } else {
            Write-Host "GDAL not found via gdalinfo or Python bindings. Tests may still run but some comparisons may be limited."
          }
        }

    - name: Issue flows2fim controls test cases
      run: |
        ./scripts/test_suite_windows.sh controls
      shell: bash

    - name: Issue flows2fim fim test cases
      run: |
        ./scripts/test_suite_windows.sh fim
      shell: bash

    - name: Issue flows2fim validate test cases
      run: |
        ./scripts/test_suite_windows.sh validate
      shell: bash
