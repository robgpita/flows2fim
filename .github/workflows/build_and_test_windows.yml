name: Build and Test - Windows

on:
  push:
    branches: [main, add_windows_workflow]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build flows2fim (Windows binary)

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      uses: docker/setup-buildx-action@v3

    - name: Run Docker Compose
      run: |
        docker compose up -d
        docker ps

    - name: Attach to running container and Build Windows executable
      run: |
        CONTAINER_ID=$(docker ps -q | head -n 1)
        if [ -n "$CONTAINER_ID" ]; then
          docker exec $CONTAINER_ID /bin/bash -c "./scripts/build-windows-amd64.sh"
          docker compose down
        else
          echo "No running containers found"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flows2fim
        path: builds/windows-amd64

  test:
    name: Test flows2fim on Windows
    runs-on: windows-latest
    needs: build

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: flows2fim
        path: builds/windows-amd64

    - name: Add flows2fim to PATH and verify binary
      shell: powershell
      run: |
        Write-Host "Listing artifact contents"
        Get-ChildItem -Recurse builds\windows-amd64
        Write-Host "Invoke version"
        if (Test-Path "builds\windows-amd64\flows2fim.exe") {
          & "builds\windows-amd64\flows2fim.exe" --version
          $fullPath = (Resolve-Path "builds\windows-amd64").Path
          Add-Content -Path $env:GITHUB_PATH -Value $fullPath
        } else {
          Write-Error "flows2fim.exe not found in builds\windows-amd64"
          exit 1
        }

    - name: Setup Conda (install GDAL via conda)
      uses: conda-incubator/setup-miniconda@v2
      with:
        auto-update-conda: true
        python-version: '3.9'
        activate-environment: ci
        channels: conda-forge
      env:
        CONDA_VERBOSITY: 0

    - name: Install GDAL
      shell: bash -l {0}
      run: |
        # Use conda to install GDAL from conda-forge
        # Note: On Windows, GDAL utilities are included in the main gdal package
        conda install -n ci -y -c conda-forge gdal libgdal

        # Verify GDAL installation
        conda run -n ci python -c "import importlib.util; import sys; print('osgeo present' if importlib.util.find_spec('osgeo') else '')"

        # Check for gdalcompare utility
        conda run -n ci python -c "import importlib.util; import sys; print('osgeo_utils present' if importlib.util.find_spec('osgeo_utils') else 'osgeo_utils NOT present')"

    - name: Add conda env scripts to PATH
      shell: powershell
      run: |
        Write-Host "Adding conda environment scripts path to PATH (if present)"

        # First check if conda is available
        try {
          $condaCheck = & conda --version 2>&1
          Write-Host "Conda version: $condaCheck"
        } catch {
          Write-Host "Conda not available in PowerShell"
          exit 0
        }

        # Try to get the scripts path
        $ErrorActionPreference = 'SilentlyContinue'
        $condaScripts = & conda run -n ci python -c 'import sysconfig;print(sysconfig.get_path(\"scripts\"))' 2>$null
        $ErrorActionPreference = 'Continue'

        Write-Host "Raw output from conda run: '$condaScripts'"
        Write-Host "Output length: $($condaScripts.Length)"

        if ($condaScripts) {
          $condaScripts = $condaScripts.Trim()
          Write-Host "After trim: '$condaScripts' (length: $($condaScripts.Length))"

          if ($condaScripts -ne "") {
            Write-Host "Checking if path exists: $condaScripts"
            if (Test-Path -Path $condaScripts) {
              Write-Host "Conda scripts path found and added: $condaScripts"
              Add-Content -Path $env:GITHUB_PATH -Value $condaScripts
            } else {
              Write-Host "Conda scripts path does not exist: $condaScripts"
            }
          } else {
            Write-Host "Conda scripts path is empty after trimming"
          }
        } else {
          Write-Host "No output from conda run command"
        }

    - name: Verify Python GDAL utilities (conda)
      shell: bash -l {0}
      run: |
        echo "Verifying osgeo_utils availability in conda env 'ci'"
        if conda run -n ci python -c "import importlib.util; import sys; sys.exit(0 if importlib.util.find_spec('osgeo_utils') else 1)" 2>/dev/null; then
          echo "osgeo_utils available in conda env 'ci'"
        else
          echo "osgeo_utils not available in conda env 'ci'. Tests will continue but some features may be limited."
        fi
        # Also show conda python scripts path (for debugging)
        pyScriptsPath=$(conda run -n ci python -c "import sysconfig;print(sysconfig.get_path('scripts'))" 2>/dev/null || echo "")
        if [ -n "$pyScriptsPath" ]; then
          echo "Conda python scripts path: $pyScriptsPath"
        fi

    - name: Verify gdal installation
      shell: bash -l {0}
      run: |
        # Prefer gdalinfo if available, otherwise try to detect GDAL via Python bindings
        if command -v gdalinfo >/dev/null 2>&1; then
          gdalinfo --version
          echo "gdalinfo available: $(command -v gdalinfo)"
        else
          echo "gdalinfo not found; attempting to detect GDAL via Python bindings"
          ver=$(conda run -n ci python -c "from osgeo import gdal; import sys; print(gdal.__version__)" 2>/dev/null || echo "")
          if [ -n "$ver" ]; then
            echo "GDAL Python binding version: $ver"
          else
            echo "GDAL not found via gdalinfo or Python bindings. Tests may still run but some comparisons may be limited."
          fi
        fi

    - name: Issue flows2fim controls test cases
      shell: bash -l {0}
      run: |
        ./scripts/test_suite_windows.sh controls

    - name: Issue flows2fim fim test cases
      shell: bash -l {0}
      continue-on-error: true
      run: |
        ./scripts/test_suite_windows.sh fim

    - name: Issue flows2fim validate test cases
      shell: bash -l {0}
      run: |
        ./scripts/test_suite_windows.sh validate
